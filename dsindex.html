<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downsize · 视频与照片压缩</title>
<meta name="description" content="把视频和照片稳定压缩到指定大小以内，全程本机处理，绝不上传。">
<style>
  :root { --indigo: #5b5bd6; --ink: #1c1c28; --muted: #6b6b7b; --bg: #f5f5f7; --card: #ffffff; --line: #e5e5ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 20px 72px; }
  .hero { text-align: center; padding-bottom: 8px; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 18px; background: rgba(91,91,214,0.12); color: var(--indigo); font-size: 36px; margin-bottom: 18px; }
  h1 { font-size: 2.1rem; margin: 0 0 10px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); font-size: 1.08rem; margin: 0 auto; max-width: 520px; }
  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 36px; }
  .feature { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .feature .ic { font-size: 22px; margin-bottom: 8px; }
  .feature h3 { margin: 0 0 4px; font-size: 1.02rem; }
  .feature p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
  .links a { display: inline-block; padding: 12px 24px; border-radius: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; }
  .links a.primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .links a:hover { opacity: 0.92; }
  footer { margin-top: 44px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  @media (max-width: 520px) { .features { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="badge">📦</div>
    <h1>Downsize</h1>
    <p class="lede">把视频和照片稳定压缩到你指定的大小以内，保证顺利上传与分享。全程在设备本地处理，绝不上传你的媒体文件。</p>
  </div>

  <div class="features">
    <div class="feature">
      <div class="ic">🎯</div>
      <h3>压到指定大小</h3>
      <p>设定目标后自动降档重压，输出体积不超过目标。</p>
    </div>
    <div class="feature">
      <div class="ic">🔒</div>
      <h3>纯本地处理</h3>
      <p>没有任何上传媒体的代码路径，隐私由设计保证。</p>
    </div>
    <div class="feature">
      <div class="ic">🖼️</div>
      <h3>视频与照片</h3>
      <p>HEVC / H.264 视频，HEIC / JPEG 照片，按需选择。</p>
    </div>
    <div class="feature">
      <div class="ic">🧹</div>
      <h3>批量清理</h3>
      <p>一次压缩多个视频，逐个确认后删原件、释放空间。</p>
    </div>
  </div>

  <div class="links">
    <a class="primary" href="privacy.html">隐私政策</a>
    <a href="support.html">支持</a>
  </div>

  <footer>© 2026 Downsize · 视频与照片压缩</footer>
</div>
</body>
</html>
